  <text x="50" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#334155">Select a time for Wednesday, Oct 28</text>

  <!-- Time Grid (3 columns) -->
  <!-- Slot 1 -->
  <rect x="50" y="260" width="135" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="117" y="283" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#1e293b" text-anchor="middle">09:00 AM</text>

  <!-- Slot 2 (Selected) -->
  <rect x="202" y="260" width="135" height="36" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="269" y="283" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#2563eb" text-anchor="middle">10:30 AM</text>

  <!-- Slot 3 -->
  <rect x="354" y="260" width="135" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="421" y="283" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#1e293b" text-anchor="middle">01:00 PM</text>

  <!-- Slot 4 -->
  <rect x="50" y="306" width="135" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="117" y="329" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#1e293b" text-anchor="middle">02:30 PM</text>

  <!-- Slot 5 -->
  <rect x="202" y="306" width="135" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="269" y="329" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#1e293b" text-anchor="middle">03:45 PM</text>

  <!-- Slot 6 -->
  <rect x="354" y="306" width="135" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="421" y="329" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#1e293b" text-anchor="middle">04:30 PM</text>

  <!-- Confirm Button -->
  <rect x="50" y="365" width="440" height="44" rx="8" fill="#2563eb"/>
  <text x="270" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Confirm Slot &amp; Enter Details →</text>

  <!-- Footer Link -->
  <text x="270" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94a3b8" text-anchor="middle">
    Powered by <tspan fill="#2563eb" font-weight="600">MyFormConnect</tspan>
  </text>
</svg>
