<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" width="100%" height="auto">
  <defs>
    <filter id="widgetShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity="0.08" flood-color="#0f172a"/>
    </filter>
  </defs>

  <!-- Outer Card -->
  <rect x="25" y="20" width="490" height="460" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#widgetShadow)"/>

  <!-- Widget Header -->
  <text x="50" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Book an Intro Call</text>
  <text x="50" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b">15-minute discovery consultation • Google Meet</text>
  <line x1="50" y1="94" x2="490" y2="94" stroke="#f1f5f9" stroke-width="1.5"/>

  <!-- Calendar Month Navigation -->
  <text x="50" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1e293b">October 2026</text>
  <!-- Prev/Next buttons -->
  <rect x="420" y="110" width="28" height="28" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M 436 120 L 431 124 L 436 128" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="456" y="110" width="28" height="28" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M 468 120 L 473 124 L 468 128" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Days of Week Header -->
  <text x="75" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">MO</text>
  <text x="135" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">TU</text>
  <text x="195" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">WE</text>
  <text x="255" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">TH</text>
  <text x="315" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">FR</text>
  <text x="375" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">SA</text>
  <text x="435" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">SU</text>

  <!-- Calendar Date Rows -->
  <!-- Selected Date (Oct 28) highlighted in Brand Blue -->
  <rect x="175" y="170" width="40" height="32" rx="8" fill="#2563eb"/>
  <text x="195" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">28</text>

  <!-- Other Available Dates -->
  <text x="75" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">26</text>
  <text x="135" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#334155" text-anchor="middle">27</text>
  <text x="255" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#2563eb" text-anchor="middle">29</text>
  <text x="315" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#2563eb" text-anchor="middle">30</text>
  <text x="375" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">31</text>
  <text x="435" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">1</text>

