<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" width="100%" height="auto">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-opacity="0.07" flood-color="#0f172a"/>
    </filter>
  </defs>

  <!-- Form Card -->
  <rect x="25" y="20" width="570" height="440" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Eyebrow & Title -->
  <text x="55" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#4D9B1B">GET IN TOUCH</text>
  <text x="55" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#062B49">Let's build a greener future.</text>
  <text x="55" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b">Tell us about your energy requirements or project.</text>

  <!-- Row 1: Full Name & Work Email -->
  <!-- Name Field -->
  <text x="55" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Full Name <tspan fill="#4D9B1B">*</tspan></text>
  <rect x="55" y="144" width="245" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="68" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Your full name</text>

  <!-- Email Field -->
  <text x="320" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Work Email <tspan fill="#4D9B1B">*</tspan></text>
  <rect x="320" y="144" width="245" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="333" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">you@company.com</text>

  <!-- Row 2: Phone & Service -->
  <!-- Phone Field -->
  <text x="55" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Phone Number</text>
  <rect x="55" y="214" width="245" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="68" y="237" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">+1 (555) 000-0000</text>

  <!-- Service Field -->
  <text x="320" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Service <tspan fill="#4D9B1B">*</tspan></text>
  <rect x="320" y="214" width="245" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="333" y="237" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#334155">Solar Installation</text>
  <path d="M 545 230 L 550 236 L 555 230" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Row 3: Project Message -->
  <text x="55" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Tell us about your project <tspan fill="#4D9B1B">*</tspan></text>
  <rect x="55" y="284" width="510" height="64" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="68" y="307" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Tell us about your requirements...</text>

  <!-- Submit Button -->
  <rect x="55" y="365" width="510" height="42" rx="6" fill="#4D9B1B"/>
  <text x="310" y="391" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Send Enquiry →</text>

  <!-- Footer Link -->
  <text x="310" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94a3b8" text-anchor="middle">
    Powered by <tspan fill="#2563eb" font-weight="600">MyFormConnect</tspan>
  </text>
</svg>
